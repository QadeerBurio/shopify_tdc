# This file tells Shopify what your app is called, what permissions
# it needs, and what events it wants to be notified about.

client_id = "f35cdba51cf047b59799f1f2d8551c19"
name = "The Deft Crew"
handle = "the-deft-crew"
application_url = "https://the-deft-crew.myshopify.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
scopes = "write_discounts,read_orders,read_customers,read_products,read_price_rules"

[auth]
redirect_urls = [
  "https://shopifytdc-production.up.railway.app/auth/callback",
  "https://shopifytdc-production.up.railway.app/auth/shopify/callback",
  "https://shopifytdc-production.up.railway.app/api/auth/callback"
]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
topics = ["app/scopes_update"]
uri = "/webhooks/app/scopes_update"

# Held back for now:
# shop/redact — CLI is rejecting this topic as "invalid", likely a version
# mismatch from running Shopify CLI v3. Revisit once Node is upgraded and
# the newer CLI can be used again, or add it manually in the Partner
# Dashboard's webhook settings instead of through this file.
#
# [[webhooks.subscriptions]]
# topics = ["shop/redact"]
# uri = "/webhooks/app/shop_redact"
#
# customers/data_request, customers/redact, orders/create, orders/updated
# still need Protected Customer Data approval before adding back too.

[pos]
embedded = false
